# Publicación automática en Vercel.
# - Pull request: revisa el código (tipos y pruebas). No se publica nada.
# - Merge a main: revisa el código y publica en producción (app.wontex-devs.com).
# Necesita el secreto VERCEL_TOKEN (Settings → Secrets and variables → Actions).
name: Publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_VRb0FsZsiujcuKwofw3vXnne
  PROD_PROJECT_ID: prj_GYEBm6faXVj0gDWqBQLLaHoi34GQ
  VERCEL_CLI: vercel@65.9.0

jobs:
  revisar:
    name: Revisar el código
    runs-on: ubuntu-latest
    # Sin el secreto VERCEL_TOKEN solo se revisa el código y no se publica nada.
    outputs:
      publicar: ${{ steps.token.outputs.publicar }}
    steps:
      - id: token
        run: echo "publicar=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  produccion:
    name: Producción
    if: github.event_name == 'push' && needs.revisar.outputs.publicar == 'true'
    needs: revisar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar producción
        env:
          VERCEL_PROJECT_ID: ${{ env.PROD_PROJECT_ID }}
        run: npx --yes $VERCEL_CLI deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
